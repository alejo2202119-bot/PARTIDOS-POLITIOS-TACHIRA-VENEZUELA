# ============================================================================
#  Venezuela Political Intelligence Dashboard — local / staging stack
#  Production deployments should use managed Postgres (Supabase) + a CDN for
#  the frontend. See docs/DEPLOYMENT.md.
# ============================================================================
services:

  db:
    image: postgres:15-alpine
    container_name: vpid_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vpid}
      POSTGRES_USER: ${POSTGRES_USER:-vpid_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    ports:
      - "5432:5432"
    volumes:
      - vpid_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpid_app} -d ${POSTGRES_DB:-vpid}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vpid_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - vpid_redis:/data

  backend:
    build: ./backend
    container_name: vpid_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  etl:
    build: ./backend
    container_name: vpid_etl
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./storage:/app/storage
    # APScheduler-driven daily pipeline (ingest → clean → classify → analyze → report)
    command: python -m app.etl.scheduler

  frontend:
    image: nginx:1.27-alpine
    container_name: vpid_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  vpid_pgdata:
  vpid_redis:
